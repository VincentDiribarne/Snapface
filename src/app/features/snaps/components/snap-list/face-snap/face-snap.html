<div class="fs-card">
  <snap-profile [user]="user"
                [relativeCreatedAt]="faceSnap.relativeDate"
                [createdAt]="faceSnap.createdAt"
                [location]="faceSnap.location"
  />

  <img [ngSrc]="faceSnap.imageURL" referrerpolicy="no-referrer" alt="Image Face Snap" width="400" height="400">

  <div class="fs-footer">
    <snap-footer [snapModel]="faceSnap.snapModel" (snapChanged)="snapChanged.emit($event)"/>

    <p class="fs-description">{{ faceSnap.description }}</p>
  </div>
</div>
