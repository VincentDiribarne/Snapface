<div class="fs-profile">
  <img class="fs-img" [ngSrc]="user.imageURL" [alt]="user.name" width="32" height="32">

  <div class="fs-information">
    <div class="fs-user-information">
      <span class="fs-user-name">{{user.name | lowercase}}</span>

      <span class="fs-gray">·</span>
      <div class="date-container">
        <span class="fs-gray date-relative">{{ relativeCreatedAt }}</span>

        <div class="date-tooltip">
          {{ createdAt | date:'dd/MM/yyyy à HH:mm' }}
        </div>
      </div>
    </div>

    @if (location) {
      <span class="fs-gray">{{location}}</span>
    }
  </div>

  <div class="fs-parameter">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 10.8333C10.4602 10.8333 10.8333 10.4602 10.8333 10C10.8333 9.53976 10.4602 9.16667 10 9.16667C9.53976 9.16667 9.16666 9.53976 9.16666 10C9.16666 10.4602 9.53976 10.8333 10 10.8333Z" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.8333 10.8333C16.2936 10.8333 16.6667 10.4602 16.6667 10C16.6667 9.53976 16.2936 9.16667 15.8333 9.16667C15.3731 9.16667 15 9.53976 15 10C15 10.4602 15.3731 10.8333 15.8333 10.8333Z" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4.16667 10.8333C4.62691 10.8333 5 10.4602 5 10C5 9.53976 4.62691 9.16667 4.16667 9.16667C3.70643 9.16667 3.33334 9.53976 3.33334 10C3.33334 10.4602 3.70643 10.8333 4.16667 10.8333Z" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
