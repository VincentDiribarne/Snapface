<div class="fs-card">
  <app-profile [user]="faceSnap.user"
               [relativeCreatedAt]="faceSnap.relativeDate"
               [createdAt]="faceSnap.createdAt"
               [location]="faceSnap.location"
  />

  <img [ngSrc]="faceSnap.imageURL" alt="Image Face Snap" width="10" height="10">

  <div class="fs-footer">
    <app-snap-footer [snapModel]="faceSnap.snap"/>

    <span class="fs-description">{{ faceSnap.description }}</span>
  </div>
</div>
